<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background" aria-hidden="true">
        <div class="oil-layer oil-layer-1"></div>
        <div class="oil-layer oil-layer-2"></div>
        <div class="oil-layer oil-layer-3"></div>
        <div class="oil-sheen"></div>
        <div class="noise-overlay"></div>
    </div>

    <main class="welcome">
        <h1>welcome, please login</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="{{ 'success-message' if category == 'success' else 'error-message' }}" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% if error %}
        <div class="error-message" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">email</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <input type="submit" value="Log In">
        </form>
        <p class="switch-auth">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
    </main>
</body>
</html>
